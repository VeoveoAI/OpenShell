{{- include "openshell-workspace.validateValues" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-workspace.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-workspace.labels" . | nindent 4 }}
rules:
  {{- if .Values.gateway.allowDriverConfig }}
  # Metadata-only admission of caller-selected PVCs requires get permission.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  {{- end }}
  # A delete with keep_workspace detaches the sandbox's workspace claim; the
  # next sandbox of the same name restores it for adoption.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "patch"]
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
  # Generation-scoped sandbox bootstrap Secrets.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
